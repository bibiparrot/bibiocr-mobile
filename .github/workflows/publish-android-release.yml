name: Publish Android APKs from a build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag
        required: true
      run_id:
        description: Successful Android APKs build run ID
        required: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: bibiocr-apk-*
          path: dist
          merge-multiple: true
      - name: Publish APKs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          $apks = @(Get-ChildItem dist -Filter '*.apk' | ForEach-Object FullName)
          if ($apks.Count -ne 4) { throw "Expected 4 APKs, found $($apks.Count)" }
          gh release create $env:RELEASE_TAG @apks --verify-tag --prerelease --title $env:RELEASE_TAG --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publishing failed' }
